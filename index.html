<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- The browser chrome around a standalone install takes the page's own near-black. -->
    <meta name="theme-color" content="#0a0a0c" />
    <title>sonn player</title>
    <!--
      Installable: a phone puts the player on its home screen, a wall panel runs it without a
      URL bar. The manifest's relative paths resolve against /player/, where the audioserver
      serves this bundle; Vite prefixes the absolute hrefs below with the same base.

      There is a service worker now, and the reason there was none still stands — a cache-first
      shell would keep replaying an old build after every upgrade. So it is network-first and
      never consults the cache while a response is coming; see `public/sw.js`. What it buys is
      the install prompt, which Chromium will not offer without one.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Safari ignores the manifest; these are the lines it reads instead. `-capable` is what
         drops the browser chrome once the app is on the home screen, and `black-translucent`
         lets the near-black page run under the status bar (the layout already insets itself
         with `viewport-fit=cover` and `env(safe-area-inset-*)`).

         The `-v2` in the filenames is not decoration. iOS keeps its home-screen icons in a cache
         keyed by *url*, and that cache outlives removing the app — so replacing the artwork behind
         the same name leaves the old tile on the home screen no matter how many times it is added
         again. A new name is the only thing it cannot have seen before. Rename on every change. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `black`, not `black-translucent`, and this one line is the whole story of the black band
      that sat under the tab bar for four attempts.

      `black-translucent` asks iOS for the full screen and gives it: the page is laid out from
      y=0, under the status bar. What it does *not* do is report a viewport of that height — the
      viewport stays the usable area, so every honest measurement of it (`vh`, `dvh`,
      `innerHeight`, `position: fixed`) is short by exactly the status bar, and the difference
      falls off the bottom as a strip nothing can reach. Four fixes anchored harder to a viewport
      that was itself the wrong size.

      `black` asks for the ordinary thing: the web view begins below the status bar, the viewport
      is the whole of it, and the bottom edge is the bottom edge. The status bar takes the page's
      own near-black either way, so nothing is lost visually — the app simply stops being drawn
      partly outside the box it is measured in.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="sonn" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
